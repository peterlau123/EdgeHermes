# Codecov configuration for Peregrine
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

  precision: 2
  round: down
  range: "70...100"

ignore:
  - "test/**"
  - "standalone/**"
  - "documentation/**"
  - "build*/**"
  - "cmake/**"

comment:
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

fixes:
  - "before/:/after/"  # Path fixes if needed




