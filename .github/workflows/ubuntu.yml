
name: Ubuntu

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  _anchors:
    if: false
    runs-on: ubuntu-latest
    steps:
      - &step_checkout
        uses: actions/checkout@v4
      - &step_setup_python
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - &step_install_conan
        name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan
      - &step_detect_profile
        name: Detect Conan profile
        run: conan profile detect --force

  deps_build_release:
    name: Build and create package (Release)
    runs-on: ubuntu-latest
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache (release)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build project and create package (Release)
        run: |
          mkdir -p build install
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=Release -o build_tests=True
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DNOVA_LLM_ENABLE_LOGGING=ON -DCMAKE_INSTALL_PREFIX=../install -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          cmake --install . --config Release
      - name: Create NovaLLM package (conan, Release)
        run: |
          cd "$GITHUB_WORKSPACE"
          conan create . --user=local --channel=testing --build=missing -s build_type=Release || (
            echo "conan create failed. Listing repo:"; ls -la; exit 1
          )
      - name: Save Conan cache (release)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}

  deps_build_debug:
    name: Build and create package (Debug)
    runs-on: ubuntu-latest
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache (debug)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build project and create package (Debug)
        run: |
          mkdir -p build-debug install-debug
          cd build-debug
          conan install .. --output-folder=. --build=missing -s build_type=Debug -o build_tests=True
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S .. -B . -DCMAKE_BUILD_TYPE=Debug  -DNOVA_LLM_ENABLE_LOGGING=ON -DCMAKE_INSTALL_PREFIX=../install-debug -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          cmake --install . --config Debug
      - name: Create NovaLLM package (conan, Debug)
        run: |
          cd "$GITHUB_WORKSPACE"
          conan create . --user=local --channel=testing --build=missing -s build_type=Debug || (
            echo "conan create debug failed. Listing repo:"; ls -la; exit 1
          )
      - name: Save Conan cache (debug)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}

  run_test:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    needs: deps_build_debug
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build and run tests
        run: |
          mkdir -p build-test
          cd build-test
          conan install ../test --output-folder=conan --build=missing -s build_type=Debug || (
            echo "conan install for tests failed"; ls -la ..; exit 1
          )
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S ../test -B . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          # 可选：ctest --output-on-failure

  run_coverage:
    name: Build & Run Tests with Coverage
    runs-on: ubuntu-latest
    needs: deps_build_debug
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build and run tests with coverage
        run: |
          mkdir -p build-coverage
          cd build-coverage
          conan install ../test --output-folder=conan --build=missing -s build_type=Debug
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S ../test -B . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TEST_COVERAGE=ON \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          ctest --output-on-failure || true
      - name: Generate coverage report
        run: |
          cd build-coverage
          # lcov --directory . --capture --output-file coverage.info
          # Added --ignore-errors mismatch to handle GTest/GCC 13 issues
          lcov --directory . --capture --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/test/*' '*/conan/*' --output-file coverage.info
          lcov --list coverage.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./build-coverage/coverage.info
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

  run_standalone:
    name: Build & Run Standalone
    runs-on: ubuntu-latest
    needs: deps_build_release
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build and run standalone
        run: |
          mkdir -p build-standalone
          cd build-standalone
          conan install ../standalone --output-folder=conan --build=missing -s build_type=Release || (
            echo "conan install standalone failed"; ls -la ..; exit 1
          )
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S ../standalone -B . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          # 可选：运行可执行文件
