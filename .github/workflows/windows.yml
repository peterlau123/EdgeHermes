
name: Windows

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

defaults:
  run:
    shell: bash

jobs:
  _anchors:
    if: false
    runs-on: windows-latest
    steps:
      - &step_checkout
        uses: actions/checkout@v4
      - &step_setup_python
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - &step_install_conan
        name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan
      - &step_detect_profile
        name: Detect Conan profile
        run: conan profile detect --force

  deps_build_release:
    name: Build and create package (Release)
    runs-on: windows-latest
    strategy:
      matrix:
        generator: ["Visual Studio 17 2022"]
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache (release)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build project and create package (Release)
        run: |
          cmake -E make_directory build install
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=Release -o build_tests=True
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S .. -B . -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Release  -Dedgehermes_ENABLE_LOGGING=ON -DCMAKE_INSTALL_PREFIX=../install -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          cmake --install . --config Release
      - name: Create EdgeHermes package (conan, Release)
        run: |
          cd "$GITHUB_WORKSPACE"
          conan create . --user=local --channel=testing --build=missing -s build_type=Release || (
            echo "conan create failed. Listing repo:"; ls -la; exit 1
          )
      - name: Save Conan cache (release)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}

  deps_build_debug:
    name: Build and create package (Debug)
    runs-on: windows-latest
    strategy:
      matrix:
        generator: ["Visual Studio 17 2022"]
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache (debug)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build project and create package (Debug)
        run: |
          cmake -E make_directory build-debug install-debug
          cd build-debug
          conan install .. --output-folder=. --build=missing -s build_type=Debug -o build_tests=True
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S .. -B . -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Debug  -Dedgehermes_ENABLE_LOGGING=ON -DCMAKE_INSTALL_PREFIX=../install-debug -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          cmake --install . --config Debug
      - name: Create EdgeHermes package (conan, Debug)
        run: |
          cd "$GITHUB_WORKSPACE"
          conan create . --user=local --channel=testing --build=missing -s build_type=Debug || (
            echo "conan create debug failed. Listing repo:"; ls -la; exit 1
          )
      - name: Save Conan cache (debug)
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}

  run_test:
    name: Build & Run Tests
    runs-on: windows-latest
    needs: deps_build_debug
    strategy:
      matrix:
        generator: ["Visual Studio 17 2022"]
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-debug-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build and run tests
        run: |
          cmake -E make_directory build-test
          cd build-test
          conan install ../test --output-folder=conan --build=missing -s build_type=Debug || (
            echo "conan install for tests failed"; ls -la ..; exit 1
          )
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S ../test -B . -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          # 可选：ctest --output-on-failure

  run_standalone:
    name: Build & Run Standalone
    runs-on: windows-latest
    needs: deps_build_release
    strategy:
      matrix:
        generator: ["Visual Studio 17 2022"]
    steps:
      - *step_checkout
      - *step_setup_python
      - *step_install_conan
      - *step_detect_profile
      - name: Restore Conan cache
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-release-${{ hashFiles('**/conanfile.py', '**/standalone/conanfile.txt', 'source/**', 'include/**') }}
      - name: Build and run standalone
        run: |
          cmake -E make_directory build-standalone
          cd build-standalone
          conan install ../standalone --output-folder=conan --build=missing -s build_type=Release || (
            echo "conan install standalone failed"; ls -la ..; exit 1
          )
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          cmake -S ../standalone -B . -G "${{ matrix.generator }}" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          # 可选：运行可执行文�?



