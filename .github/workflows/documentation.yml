name: Documentation

on:
  push:
    branches:
      - 'main'  # All branches
      - 'master'
      - 'develop'
      - 'release/**'
    paths:
      - '**.h'
      - '**.cpp'
      - 'Doxyfile'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Configure (Release)
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          # Install dependencies via Conan (no cache used)
          conan install .. --output-folder=. --build=missing -s build_type=Release -o build_tests=False
          # Locate Conan-generated toolchain then configure CMake for a Release build
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1 || true)
          if [ -n "$TOOLCHAIN_FILE" ]; then
            echo "Using toolchain file: $TOOLCHAIN_FILE"
            cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE" -DNOVA_LLM_BUILD_TESTS=OFF -DNOVA_LLM_ENABLE_LOGGING=OFF
          else
            echo "No conan_toolchain.cmake found, configuring without toolchain"
            cmake -S .. -B . -DCMAKE_BUILD_TYPE=Release -DNOVA_LLM_BUILD_TESTS=OFF -DNOVA_LLM_ENABLE_LOGGING=OFF
          fi

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build documentation
        run: |
          cd build
          cmake --build . --target docs

      - name: Check documentation output
        run: |
          if [ ! -d "docs/html" ]; then
            echo "Error: Documentation not generated at docs/html"
            ls -la docs/ || echo "docs/ directory not found"
            exit 1
          fi
          echo "Documentation generated successfully"
          ls -la docs/html/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 