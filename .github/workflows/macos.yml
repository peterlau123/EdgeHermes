name: MacOS

on:
  push:
    branches:
      - '**'  # This will match all branches
  pull_request:
    branches:
      - '**'  # This will match all branches

env:
  CTEST_OUTPUT_ON_FAILURE: 1
  # Using Conan for dependency management

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Conan
        run: |
          python -m pip install --upgrade pip
          pip install conan

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.py', '**/conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Build and install NovaLLM package
        run: |
          mkdir -p build install
          cd build
          conan install .. --output-folder=. --build=missing -s build_type=Release -o build_tests=True
          # Find the actual toolchain file location and convert to absolute path
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "Error: conan_toolchain.cmake not found"
            echo "Searching from: $(pwd)"
            find . -type f -name "*.cmake" | head -10
            exit 1
          fi
          echo "Using toolchain file: $TOOLCHAIN_FILE"
          cmake -S .. -B . \
            -DCMAKE_BUILD_TYPE=Release \
            -DNOVA_LLM_BUILD_TESTS=ON \
            -DNOVA_LLM_ENABLE_LOGGING=ON \
            -DCMAKE_INSTALL_PREFIX=../install \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Create NovaLLM package
        run: |
          # Diagnostic: print current directory and list files to help debug missing conanfile
          echo "---- Workspace diagnostic before conan create ----"
          echo "pwd:"; pwd
          echo "ls -la (root):"; ls -la
          echo "ls -la GITHUB_WORKSPACE:"; ls -la "$GITHUB_WORKSPACE" || true

          # Ensure we are in the repository root (where conanfile.py is expected).
          # Explicit cd to GITHUB_WORKSPACE is a safe default in Actions.
          cd "$GITHUB_WORKSPACE" || true

          # Create the package from the project root directory
          # The package will be created as novallm/0.1.0@local/testing
          conan create . --user=local --channel=testing --build=missing -s build_type=Release || (
            echo "conan create failed. Listing directory to help debugging:"; ls -la; exit 1
          )

          # Verify the package was created and can be found
          echo "Verifying package creation..."
          conan search novallm/0.1.0@local/testing || conan list novallm/0.1.0@local/testing

      - name: Build and test
        run: |
          mkdir -p build-test
          cd build-test
          conan install ../test --output-folder=conan --build=missing -s build_type=Debug
          # Find the actual toolchain file location (could be in conan/ or conan/Debug/generators/)
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "Error: conan_toolchain.cmake not found"
            echo "Searching from: $(pwd)"
            find . -type f -name "*.cmake" | head -20
            exit 1
          fi
          echo "Using toolchain file: $TOOLCHAIN_FILE"
          cmake -S ../test -B . \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Debug
          # TODO: Add test for installed version
          # ctest --build-config Debug --output-on-failure

      - name: Build and run standalone
        run: |
          # Diagnostic: ensure we're in the expected workspace and show relevant files
          echo "---- Standalone step diagnostic ----"
          echo "pwd:"; pwd
          echo "ls -la (root):"; ls -la "$GITHUB_WORKSPACE" || true
          echo "ls -la (repo root):"; ls -la || true
          echo "ls -la standalone:"; ls -la standalone || true

          # Show whether the novallm package exists in local conan cache
          echo "Checking local Conan cache for novallm package..."
          conan search novallm/0.1.0@local/testing || true

          mkdir -p build-standalone
          cd build-standalone

          # Run conan install for the standalone project; if it fails, dump files for debugging
          conan install ../standalone --output-folder=conan --build=missing -s build_type=Release || (
            echo "conan install failed. Dumping current dir content:"; pwd; ls -la; echo "Dump ../standalone:"; ls -la ../standalone || true; exit 1
          )

          # Find the actual toolchain file location
          TOOLCHAIN_FILE=$(find $(pwd) -name "conan_toolchain.cmake" -type f | head -1)
          if [ -z "$TOOLCHAIN_FILE" ]; then
            echo "Error: conan_toolchain.cmake not found"
            echo "Searching from: $(pwd)"
            find . -type f -name "*.cmake" | head -10
            exit 1
          fi
          echo "Using toolchain file: $TOOLCHAIN_FILE"
          cmake -S ../standalone -B . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN_FILE"
          cmake --build . --config Release
          ./NovaLLMStandalone || ./main || find . -name "*main*" -type f -executable
